  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Receta secreta: cómo se hace una Dayana 🎂">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="loading">sacando los crayones…</div>

  <main id="book">
    <canvas id="stage" aria-label="Libro animado de cumpleaños para Dayana"></canvas>

    <div id="ui">
      <div class="top">
        <button id="music" class="chip" title="Música">♫</button>
        <button id="download" class="chip" title="Descargar la película">⬇ video</button>
      </div>

      <button id="mic" class="chip big">🎤 soplar de verdad</button>

      <div id="end">
        <button id="again" class="chip big">↺ ver otra vez</button>
        <button id="download2" class="chip big pink">⬇ descargar la película</button>
      </div>

      <nav class="bottom">
        <button id="prev" class="arrow" aria-label="Página anterior">◀</button>
        <div id="dots"></div>
        <button id="next" class="arrow" aria-label="Página siguiente">▶</button>
      </nav>
    </div>
  </main>

  <div id="rec" role="dialog" aria-modal="true">
    <div class="card">
      <h2>🎬 La película de Dayana</h2>
      <div id="recprev"></div>
      <div class="track"><div id="recbar"></div></div>
      <p id="recmsg"></p>
      <div class="row">
        <a id="recdl" class="chip big pink" href="#">⬇ descargar</a>
        <button id="recclose" class="chip big">cerrar</button>
      </div>
    </div>
  </div>

  <script src="js/content.js"></script>
  <script src="js/crayon.js"></script>
  <script src="js/props.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
